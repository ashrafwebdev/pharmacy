name: Build installers

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (server + desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync server tests
        working-directory: apps/server
        run: |
          npm ci
          npm test
      - name: Desktop tests (includes sync against the real server)
        working-directory: apps/desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci
          npm test

  installers:
    name: ${{ matrix.label }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64 installer
            os: windows-latest
            script: dist:win
            artifact: windows-x64
            pattern: |
              apps/desktop/release/*.exe
          - label: macOS Apple Silicon (arm64) DMG
            os: macos-latest
            script: dist:mac:arm64
            artifact: macos-arm64
            pattern: |
              apps/desktop/release/*.dmg
          - label: macOS Intel (x64) DMG
            os: macos-15-intel
            script: dist:mac:x64
            artifact: macos-x64
            pattern: |
              apps/desktop/release/*.dmg
          - label: Linux x64 AppImage and .deb
            os: ubuntu-latest
            script: dist:linux
            artifact: linux-x64
            pattern: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: apps/desktop
        # Electron's binary is required here, and better-sqlite3 is rebuilt for it by electron-builder.
        run: npm ci
      - name: Build installer
        working-directory: apps/desktop
        env:
          # Do not look for signing certificates on the runner; builds are unsigned unless configured.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.script }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: List files to publish
        run: find installers -type f | sort
      - name: Create release with installers
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
          fail_on_unmatched_files: true
