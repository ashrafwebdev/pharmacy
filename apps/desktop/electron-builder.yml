appId: com.pharmacysuite.desktop
productName: Pharmacy Suite
directories:
  output: release
  buildResources: build
files:
  - electron/**/*
  - dist/**/*
  - package.json
asarUnpack:
  - "**/*.node"
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pharmacy Suite
